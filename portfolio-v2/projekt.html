<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projekt — Amitiel Angelisme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&family=Bowlby+One&family=Rum+Raisin&family=Cabin:wght@400;500;600;700&family=Khand:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Gotham — próbki typografii (HubbleRx) */
@font-face{font-family:'Gotham';src:url('/portfolio/fonts/Gotham-Light.otf') format('opentype');font-weight:300;font-display:swap}
@font-face{font-family:'Gotham';src:url('/portfolio/fonts/Gotham-Medium.otf') format('opentype');font-weight:500;font-display:swap}
@font-face{font-family:'Gotham';src:url('/portfolio/fonts/Gotham-Black.otf') format('opentype');font-weight:900;font-display:swap}

:root{
  --accent:#C26A32;--cream:#f6f1e8;
  --bg:#f6f1e8;--bg2:#eee7da;--card:#fff;
  --ink:#1c1813;--soft:rgba(28,24,19,.72);--faint:rgba(28,24,19,.5);
  --line:rgba(28,24,19,.15)
}
body.dark{
  --bg:#141414;--bg2:#1c1c1c;--card:#1e1e1e;
  --ink:#f2ede3;--soft:rgba(242,237,227,.72);--faint:rgba(242,237,227,.5);
  --line:rgba(242,237,227,.15)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',sans-serif;transition:background .3s}
a{color:inherit;text-decoration:none;transition:color .25s}
a:hover{color:var(--accent)}
img{display:block;max-width:100%}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.fu1{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both}
.fu2{animation:fadeUp .8s .1s cubic-bezier(.2,.7,.2,1) both}
.fu3{animation:fadeUp .9s .25s cubic-bezier(.2,.7,.2,1) both}
.wrap{max-width:1080px;margin:0 auto;padding:0 clamp(24px,5vw,64px)}
.wrap.wide{max-width:1240px}

/* NAV */
.nav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1080px;margin:0 auto;padding:22px clamp(24px,5vw,64px);display:flex;justify-content:space-between;align-items:center}
.back{display:flex;align-items:center;gap:12px;font:700 14px 'Archivo',sans-serif}
.brand{display:inline-flex;align-items:center}
.brand-logo{height:34px;width:auto;display:block;mix-blend-mode:multiply;transition:opacity .25s}
.brand:hover .brand-logo{opacity:.65}

/* HEADER */
.head{padding:64px 0 40px;text-align:center}
.badge{display:inline-block;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:99px;padding:6px 16px;font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.08em;margin-bottom:22px}
.head h1{font:900 clamp(40px,7vw,84px)/0.98 'Archivo',sans-serif;text-transform:uppercase;letter-spacing:-.035em;margin:0}
.head h1 .ac{color:var(--accent)}
.head .sub{font:500 clamp(18px,2.4vw,26px) 'Archivo',sans-serif;color:var(--faint);margin:10px 0 0}
.head .desc{font:400 18px/1.6 'Archivo',sans-serif;color:var(--soft);max-width:640px;margin:24px auto 0}

/* wspólne */
.imgcard{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.capt{padding:10px 14px;text-align:center;font:400 13.5px/1.5 'Archivo',sans-serif;color:var(--soft);font-style:italic;background:var(--bg2)}
.sec{padding:34px 0}
.sec h2{font:900 clamp(26px,3.4vw,38px) 'Archivo',sans-serif;text-transform:uppercase;letter-spacing:-.02em;text-align:center;margin:0 0 14px}
.sec h2 .ac{color:var(--accent)}
.sec .sdesc{font:400 17px/1.65 'Archivo',sans-serif;color:var(--soft);max-width:640px;margin:0 auto 28px;text-align:center}

/* hero animation / centered dark band */
.center-band{padding:90px 24px;display:flex;justify-content:center;align-items:center}
.center-band img{max-height:28rem;object-fit:contain}
.heroanim{display:flex;justify-content:center;padding:8px 0 24px}
.heroanim img{max-width:28rem;width:100%}

/* info band */
.info{background:var(--bg2);border-block:1px solid var(--line);padding:38px 0;margin:34px 0}
.info .in{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.info .lbl{font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.info .v{font:700 17px 'Archivo',sans-serif}
.info .tools{display:flex;flex-wrap:wrap;gap:6px}
.info .tools span{font:500 11.5px 'IBM Plex Mono',monospace;border:1px solid var(--line);border-radius:99px;padding:4px 11px;color:var(--soft)}
.ext{display:flex;justify-content:center;margin-top:30px}
.ext a{background:var(--accent);color:#f6f1e8;border-radius:99px;padding:14px 34px;font:700 17px 'Archivo',sans-serif;transition:transform .25s}
.ext a:hover{transform:scale(1.06);color:#f6f1e8}

/* challenge / solution */
.cs2{display:grid;grid-template-columns:1fr 1fr;gap:44px;padding:26px 0}
.cs2 h3{font:900 22px 'Archivo',sans-serif;text-transform:uppercase;margin:0 0 12px}
.cs2 p{font:400 17px/1.65 'Archivo',sans-serif;color:var(--soft);margin:0}

/* strategic sections */
.strat{background:var(--bg2);border-block:1px solid var(--line);padding:48px 0;margin:34px 0}
.strat .blk{max-width:820px;margin:0 auto 40px}
.strat .blk:last-child{margin-bottom:0}
.strat h3{font:900 20px 'Archivo',sans-serif;text-transform:uppercase;margin:0 0 10px}
.strat p{font:400 16.5px/1.65 'Archivo',sans-serif;color:var(--soft);margin:0 0 18px}
.strat .imgs{display:grid;gap:16px}

/* typografia */
.font-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;margin-bottom:20px}
.font-card .fname{font:900 24px 'Archivo',sans-serif;margin-bottom:4px}
.font-card .fusage{font:500 12px 'IBM Plex Mono',monospace;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;margin-bottom:18px}
.font-card .w{padding:14px 0;border-top:1px solid var(--line)}
.font-card .w .wl{font:500 11px 'IBM Plex Mono',monospace;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.font-card .w .ws{font-size:clamp(20px,3vw,30px);line-height:1.25}

/* kolory */
.pal{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.sw{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.sw .c{height:110px}
.sw .m{padding:12px 14px}
.sw .m b{font:700 14px 'Archivo',sans-serif;display:block;margin-bottom:4px}
.sw .m span{font:400 11px 'IBM Plex Mono',monospace;color:var(--faint);display:block}

/* galeria główna */
.g-item{margin:0 0 26px}
.g-centered{display:flex;justify-content:center;align-items:center;padding:56px 24px}
.g-laptop{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,3vw,30px)}
.g-laptop .frame{background:#111;border-radius:14px 14px 0 0;padding:14px 14px 0;position:relative}
.g-laptop .frame::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#333}
.g-laptop .frame img{border-radius:4px 4px 0 0}
.g-laptop .base{height:14px;background:linear-gradient(#2a2a2a,#161616);border-radius:0 0 14px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.grid5 .imgcard{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:8px;background:var(--bg2)}
.grid5 img{max-width:100%;max-height:100%;object-fit:contain}
.grid2x2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* telefony */
.phones{display:flex;flex-wrap:wrap;justify-content:center;gap:26px}
.phone{width:200px}
.phone .bezel{background:#111;border-radius:28px;padding:10px;box-shadow:0 18px 40px rgba(0,0,0,.25);position:relative}
.phone .bezel::before{content:"";position:absolute;top:16px;left:50%;transform:translateX(-50%);width:56px;height:14px;background:#111;border-radius:8px;z-index:2}
.phone .scr{border-radius:20px;overflow:hidden}
.phone .scr img{width:100%}
.phone .pcapt{text-align:center;font:400 13px 'Archivo',sans-serif;color:var(--soft);margin-top:10px}

/* parallax banner */
.pbanner{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);min-height:380px;display:flex;align-items:center;justify-content:center}
.pbanner .bgim{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pbanner .fg{position:relative;z-index:2;max-height:340px;object-fit:contain;filter:drop-shadow(0 24px 40px rgba(0,0,0,.35))}

/* youtube */
.yt{position:relative;padding-top:56.25%;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* results */
.results{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:34px;max-width:820px;margin:0 auto}
.results h3{font:900 20px 'Archivo',sans-serif;text-transform:uppercase;margin:0 0 12px;color:var(--accent)}
.results p{font:400 17px/1.65 'Archivo',sans-serif;color:var(--soft);margin:0}

/* PROJECT FOOTER */
.proj-footer{background:#1c1813;color:#f6f1e8;padding:clamp(48px,6vw,80px) 0 40px;margin-top:56px}
.pf-back{display:inline-flex;align-items:center;gap:10px;font:700 13px 'Archivo',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:rgba(246,241,232,.6);transition:color .25s;margin-bottom:clamp(28px,4vw,44px)}
.pf-back:hover{color:var(--accent)}
.pf-title{font:900 clamp(26px,3.4vw,38px) 'Archivo',sans-serif;text-transform:uppercase;letter-spacing:-.02em;margin:0 0 24px}
.pf-title .ac{color:var(--accent)}
.pf-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.pf-fbtn{display:inline-flex;align-items:center;gap:6px;font:500 12px 'Archivo',sans-serif;border:1px solid rgba(246,241,232,.2);background:transparent;color:rgba(246,241,232,.7);border-radius:8px;padding:7px 13px;cursor:pointer;transition:all .2s}
.pf-fbtn:hover{border-color:rgba(246,241,232,.45);color:#f6f1e8}
.pf-fbtn.active{background:var(--accent);border-color:var(--accent);color:#f6f1e8}
.pf-fbtn svg{width:13px;height:13px;display:block}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:clamp(40px,5vw,64px)}
.pf-card{display:flex;align-items:center;gap:14px;padding:14px 16px;background:rgba(246,241,232,.06);border:1px solid rgba(246,241,232,.1);border-radius:12px;color:#f6f1e8;transition:all .25s}
.pf-card:hover{background:rgba(246,241,232,.1);border-color:rgba(246,241,232,.22);transform:translateY(-2px);color:#f6f1e8}
.pf-card.current{border-color:var(--accent);background:rgba(194,106,50,.12)}
.pf-card .pf-ico{width:42px;height:42px;flex-shrink:0;display:grid;place-items:center;background:rgba(246,241,232,.08);border-radius:10px}
.pf-card .pf-ico svg{width:20px;height:20px;color:var(--accent)}
.pf-card .pf-info{flex:1;min-width:0}
.pf-card .pf-name{font:700 13px 'Archivo',sans-serif;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-card .pf-tags{font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:rgba(246,241,232,.45);margin-top:4px}
.pf-foot{display:flex;justify-content:space-between;align-items:flex-start;padding-top:24px;border-top:1px solid rgba(246,241,232,.15);font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.13em;text-transform:uppercase;color:rgba(246,241,232,.6);gap:14px}
.pf-foot span{display:block;line-height:1.6}
.pf-foot span:last-child{text-align:right}

[data-reveal]{will-change:opacity,transform}
@media(max-width:820px){
  .nav-in{padding:14px 20px}
  .cs2,.grid2,.grid2x2{grid-template-columns:1fr}
  .info .in{grid-template-columns:1fr}
  .grid5{grid-template-columns:repeat(3,1fr)}
  .pf-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="nav"><div class="nav-in">
  <a href="index.html#projekty" class="back"><span style="font-size:18px">←</span> <span id="backLbl">Wróć do portfolio</span></a>
  <a href="index.html" class="brand"><img src="logo-a.png" alt="Amitiel" class="brand-logo"></a>
</div></div>

<div id="app"></div>

<div class="proj-footer">
  <div class="wrap">
    <a href="index.html#projekty" class="pf-back" id="pfBack">← <span id="pfBackLbl">Wróć do portfolio</span></a>
    <h2 class="pf-title" id="pfTitle">Inne projekty<span class="ac">.</span></h2>
    <div class="pf-filters" id="pfFilters"></div>
    <div class="pf-grid" id="pfGrid"></div>
    <div class="pf-foot">
      <span>© 2026<br>Amitiel Angelisme</span>
      <span id="pfCity" style="text-align:right">Warszawa, Polska<br>GMT+1</span>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
const IMG = p => '.' + p;   // assety leza obok stron (portfolio-v2/) - sciezka wzgledna dziala lokalnie i na prod
/* fonty Gotham z właściwej bazy (działa lokalnie i na prod) */
document.head.insertAdjacentHTML('beforeend','<style>'+['Gotham-Light.otf:300','Gotham-Medium.otf:500','Gotham-Black.otf:900'].map(x=>{const[f,w]=x.split(':');return "@font-face{font-family:'Gotham';src:url('"+IMG('/fonts/'+f)+"') format('opentype');font-weight:"+w+";font-display:swap}";}).join('')+'</style>');
const savedAcc = localStorage.getItem('aa_accent'); if(savedAcc) document.documentElement.style.setProperty('--accent',savedAcc);
const en = (localStorage.getItem('aa_lang')||'pl')==='en';
const T = (pl,e)=>en?e:pl;

const P = window.PROJECTS;
const slug = new URLSearchParams(location.search).get('p') || P[0].slug;
if(slug === 'hubble-rx') location.replace('hubble.html');
if(slug === 'olympus-defence') location.replace('olympus.html');
const i = Math.max(0, P.findIndex(x=>x.slug===slug));
const p = P[i];
if(p.theme==='dark') document.body.classList.add('dark');
document.title = p.title + ' — Amitiel Angelisme';
document.getElementById('backLbl').textContent = T('Wróć do portfolio','Back to portfolio');

const esc = s => (s||'').replace(/</g,'&lt;');
const cap = c => c?`<div class="capt">${esc(c)}</div>`:'';
const imgCard = (im, extra) => `<div class="imgcard" ${extra||''}><img src="${IMG(im.src)}" alt="${esc(im.alt)}" loading="lazy">${cap(im.caption)}</div>`;
const FW = {black:900,bold:700,semibold:600,medium:500,regular:400,light:300};
const FONT_MAP = {'BowlbyOne Regular':'Bowlby One','RumRaisin Regular':'Rum Raisin'};

let H = '';

/* ---------- nagłówek ---------- */
H += `<div class="head wrap">
  <div class="badge fu1">${esc(p.category)}</div>
  <h1 class="fu2">${esc(p.title.split(' - ')[0].split(' – ')[0])}<span class="ac">.</span></h1>
  ${p.subtitle?`<div class="sub fu2">${esc(p.subtitle)}</div>`:''}
  <div class="desc fu3">${esc(p.description)}</div>
</div>`;

/* ---------- hero animation ---------- */
if(p.heroAnimation) H += `<div class="heroanim wrap" data-reveal><img src="${IMG(p.heroAnimation)}" alt="${esc(p.title)}"></div>`;

/* ---------- pierwszy obraz "centered" → ciemny band (logo) ---------- */
const img0 = p.images && p.images[0];
const img0Centered = img0 && img0.displayMode==='centered';
if(img0Centered){
  H += `<div class="center-band" style="background:${img0.backgroundColor||'#1a1a2e'}" data-reveal>
    <img src="${IMG(img0.src)}" alt="${esc(img0.alt)}" style="${img0.imageScale?`max-width:${img0.imageScale*100}%;`:''}max-height:28rem">
  </div>`;
} else if(img0 && !p.heroAnimation){
  /* zwykły cover na górze */
  H += `<div class="wrap wide" data-reveal>${imgCard(img0)}</div>`;
}

/* ---------- thumbnailGrid ---------- */
if(p.thumbnailGrid){
  H += `<div class="sec wrap">
    ${p.thumbnailGrid.title?`<h2 data-reveal>${esc(p.thumbnailGrid.title)}<span class="ac">.</span></h2>`:''}
    ${p.thumbnailGrid.description?`<div class="sdesc" data-reveal>${esc(p.thumbnailGrid.description)}</div>`:''}
    <div class="grid5" data-reveal>${p.thumbnailGrid.images.map(im=>`<div class="imgcard"><img src="${IMG(im.src)}" alt="${esc(im.alt)}" loading="lazy"></div>`).join('')}</div>
  </div>`;
}

/* ---------- parallax banner ---------- */
if(p.parallaxImage){
  H += `<div class="sec wrap wide" data-reveal>
    <div class="pbanner">
      ${p.parallaxImage.backgroundImage?`<img class="bgim" src="${IMG(p.parallaxImage.backgroundImage)}" alt="">`:''}
      <img class="fg" src="${IMG(p.parallaxImage.src)}" alt="${esc(p.parallaxImage.alt)}">
    </div>
  </div>`;
}

/* ---------- info: klient / rok / narzędzia ---------- */
H += `<div class="info" data-reveal>
  <div class="wrap in">
    <div><div class="lbl">${T('Klient','Client')}</div><div class="v">${esc(p.client||T('Projekt własny','Personal project'))}</div></div>
    <div><div class="lbl">${T('Rok','Year')}</div><div class="v">${esc(p.year)}</div></div>
    <div><div class="lbl">${T('Narzędzia','Tools')}</div><div class="tools">${(p.tools||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div></div>
  </div>
  ${p.externalLink?`<div class="ext"><a href="${p.externalLink.url}" target="_blank" rel="noopener">↗ ${esc(p.externalLink.label||T('Zobacz','Visit'))}</a></div>`:''}
</div>`;

/* ---------- challenge / solution ---------- */
if(p.challenge||p.solution){
  H += `<div class="cs2 wrap" data-reveal>
    ${p.challenge?`<div><h3>${T('Wyzwanie','Challenge')}</h3><p>${esc(p.challenge)}</p></div>`:''}
    ${p.solution?`<div><h3>${T('Rozwiązanie','Solution')}</h3><p>${esc(p.solution)}</p></div>`:''}
  </div>`;
} else if(p.fullDescription){
  H += `<div class="cs2 wrap" style="grid-template-columns:1fr" data-reveal><div><h3>${T('O projekcie','About the project')}</h3><p>${esc(p.fullDescription)}</p></div></div>`;
}

/* ---------- sekcje strategiczne ---------- */
if(p.strategicSections){
  H += `<div class="strat"><div class="wrap">` + p.strategicSections.map(s=>`
    <div class="blk" data-reveal>
      <h3>${esc(s.title)}</h3>
      <p>${esc(s.content)}</p>
      ${s.images?`<div class="imgs">${s.images.map(im=>imgCard(im)).join('')}</div>`:''}
    </div>`).join('') + `</div></div>`;
}

/* ---------- typografia ---------- */
if(p.typography){
  H += `<div class="sec wrap">
    <h2 data-reveal>${T('Typografia','Typography')}<span class="ac">.</span></h2>
    <div class="sdesc" data-reveal>${esc(p.typography.description)}</div>
    ${p.typography.image?`<div class="imgcard" style="margin-bottom:20px" data-reveal><img src="${IMG(p.typography.image)}" alt="typography" loading="lazy"></div>`:''}
    ${p.typography.fonts.map(f=>{
      const fam = FONT_MAP[f.name]||f.name.split(' ')[0];
      return `<div class="font-card" data-reveal>
        <div class="fname" style="font-family:'${fam}',sans-serif">${esc(f.name)}</div>
        <div class="fusage">${esc(f.usage)}</div>
        ${f.weights.map(w=>`<div class="w"><div class="wl">${esc(w.name)}</div><div class="ws" style="font-family:'${fam}',sans-serif;font-weight:${FW[w.name.toLowerCase()]||400}">${esc(w.sample)}</div></div>`).join('')}
      </div>`;
    }).join('')}
  </div>`;
}

/* ---------- kolory ---------- */
if(p.colors){
  H += `<div class="sec wrap">
    <h2 data-reveal>${T('Kolory marki','Brand colors')}<span class="ac">.</span></h2>
    <div class="sdesc" data-reveal>${esc(p.colors.description)}</div>
    <div class="pal" data-reveal>${p.colors.palette.map(c=>`
      <div class="sw"><div class="c" style="background:${c.hex}"></div>
        <div class="m"><b>${esc(c.name)}</b><span>${c.hex}</span><span>${esc(c.rgb)}</span>${c.cmyk?`<span>${esc(c.cmyk)}</span>`:''}</div>
      </div>`).join('')}</div>
  </div>`;
}

/* ---------- heroFollowImages ---------- */
if(p.heroFollowImages){
  const half = p.heroFollowImages.filter(im=>im.gridHalf);
  const fullw = p.heroFollowImages.filter(im=>!im.gridHalf);
  H += `<div class="sec wrap wide">
    ${fullw.map(im=>`<div class="g-item" data-reveal>${im.displayMode==='centered'?`<div class="imgcard"><div class="g-centered" style="background:${im.backgroundColor||'var(--bg2)'}"><img src="${IMG(im.src)}" alt="${esc(im.alt)}" style="${im.imageScale?`max-width:${im.imageScale*100}%`:''}"></div>${cap(im.caption)}</div>`:imgCard(im)}</div>`).join('')}
    ${half.length?`<div class="grid2">${half.map(im=>imgCard(im)).join('')}</div>`:''}
  </div>`;
}

/* ---------- mobile screens ---------- */
if(p.mobileScreens){
  const m = p.mobileScreens;
  H += `<div class="sec wrap wide">
    ${m.title?`<h2 data-reveal>${esc(m.title)}<span class="ac">.</span></h2>`:''}
    ${m.description?`<div class="sdesc" data-reveal>${esc(m.description)}</div>`:''}
    ${m.screens&&m.screens.length?`<div class="phones" data-reveal>${m.screens.map(s=>`
      <div class="phone"><div class="bezel"><div class="scr"><img src="${IMG(s.src)}" alt="${esc(s.alt)}" loading="lazy"></div></div>${s.caption?`<div class="pcapt">${esc(s.caption)}</div>`:''}</div>`).join('')}</div>`:''}
    ${m.sectionImages?`<div style="margin-top:26px">${m.sectionImages.map(im=>`<div class="g-item" data-reveal>${im.backgroundColor?`<div class="imgcard"><div class="g-centered" style="background:${im.backgroundColor}"><img src="${IMG(im.src)}" alt="${esc(im.alt)}"></div>${cap(im.caption)}</div>`:imgCard(im)}</div>`).join('')}</div>`:''}
  </div>`;
}

/* ---------- gif pair ---------- */
if(p.gifPair && p.gifPair.length>=2){
  H += `<div class="sec wrap wide"><div class="grid2" data-reveal>${p.gifPair.map(g=>imgCard(g)).join('')}</div></div>`;
}

/* ---------- logo concept ---------- */
if(p.logoConcept && p.slug!=='atomic-cherry'){
  H += `<div class="sec wrap">
    <h2 data-reveal>${esc(p.logoConcept.title||'Logo Concept')}<span class="ac">.</span></h2>
    <div class="sdesc" data-reveal>${esc(p.logoConcept.description)}</div>
    <div class="imgcard" data-reveal><img src="${IMG(p.logoConcept.image)}" alt="${esc(p.logoConcept.alt)}" loading="lazy"></div>
  </div>`;
}

/* ---------- galeria główna ---------- */
if(p.images && p.images.length){
  const list = p.images.filter((im,idx)=>!(idx===0 && (img0Centered || (!p.heroAnimation && idx===0))));
  let gal = '';
  list.forEach((im,idx)=>{
    /* retailerImages przed ostatnim obrazem */
    if(p.retailerImages && p.retailerImages.length>=2 && idx===list.length-1){
      gal += `<div class="grid2 g-item" data-reveal>${p.retailerImages.map(r=>imgCard(r)).join('')}</div>`;
    }
    if(im.displayMode==='centered'){
      gal += `<div class="g-item" data-reveal><div class="imgcard"><div class="g-centered" style="background:${im.backgroundColor||'var(--bg2)'}"><img src="${IMG(im.src)}" alt="${esc(im.alt)}" style="${im.imageScale?`max-width:${im.imageScale*100}%`:''}"></div>${cap(im.caption)}</div></div>`;
    } else if(im.displayMode==='laptop'){
      gal += `<div class="g-item g-laptop" data-reveal><div class="frame"><img src="${IMG(im.src)}" alt="${esc(im.alt)}" loading="lazy"></div><div class="base"></div>${im.caption?`<div class="capt" style="background:none">${esc(im.caption)}</div>`:''}</div>`;
    } else {
      gal += `<div class="g-item" data-reveal>${imgCard(im)}</div>`;
    }
  });
  H += `<div class="sec wrap wide">${gal}</div>`;
}

/* ---------- device mockup ---------- */
if(p.deviceMockup){
  H += `<div class="sec wrap wide">
    ${p.deviceMockup.title?`<h2 data-reveal>${esc(p.deviceMockup.title)}<span class="ac">.</span></h2>`:''}
    ${p.deviceMockup.description?`<div class="sdesc" data-reveal>${esc(p.deviceMockup.description)}</div>`:''}
    <div class="imgcard" data-reveal><img src="${IMG(p.deviceMockup.image)}" alt="${esc(p.deviceMockup.alt)}" loading="lazy"></div>
  </div>`;
}

/* ---------- youtube ---------- */
if(p.youtubeVideo){
  H += `<div class="sec wrap wide">
    ${p.youtubeVideo.title?`<h2 data-reveal>${esc(p.youtubeVideo.title)}<span class="ac">.</span></h2>`:''}
    ${p.youtubeVideo.description?`<div class="sdesc" data-reveal>${esc(p.youtubeVideo.description)}</div>`:''}
    <div class="yt" data-reveal><iframe src="${p.youtubeVideo.url}" title="${esc(p.youtubeVideo.title||'Video')}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
  </div>`;
}

/* ---------- wyniki ---------- */
if(p.results){
  H += `<div class="sec wrap" data-reveal><div class="results"><h3>${T('Efekt','Result')}</h3><p>${esc(p.results)}</p></div></div>`;
}

/* ---------- real photos 2x2 ---------- */
if(p.realPhotos){
  H += `<div class="sec wrap wide">
    ${p.realPhotos.title?`<h2 data-reveal>${esc(p.realPhotos.title)}<span class="ac">.</span></h2>`:''}
    <div class="grid2x2" data-reveal>${p.realPhotos.images.map(im=>`<div class="imgcard"><img src="${IMG(im.src)}" alt="${esc(im.alt)}" loading="lazy"></div>`).join('')}</div>
  </div>`;
}

document.getElementById('app').innerHTML = H;

/* ---------- stopka: inne projekty z filtrami ---------- */
document.getElementById('pfBackLbl').textContent = T('Wróć do portfolio','Back to portfolio');
document.getElementById('pfTitle').innerHTML = T('Inne projekty','Other projects')+'<span class="ac">.</span>';
document.getElementById('pfCity').innerHTML = T('Warszawa, Polska','Warsaw, Poland')+'<br>GMT+1';

const FICONS = {
  'all':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  'branding':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2 22 12 12 22 2 12z"/></svg>',
  'ui/ux':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>',
  '3d':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5"/></svg>',
  'game':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="7" width="20" height="10" rx="5"/><path d="M7 12h3M8.5 10.5v3"/></svg>',
  'art':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 5l4 4L8 20l-5 1 1-5z"/><path d="M14 6l4 4"/></svg>',
  'motion':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z" fill="currentColor" stroke="none"/></svg>'
};
const FTAGS = {
  'hubble-rx':['UI/UX','Branding'],'olympus-defence':['3D','Game','Art'],'selva-rape':['Branding','UI'],
  'portal-smart-checkout':['AI','UI/UX'],'v17-vision-branding':['Branding','3D'],'aloha-centrum-desk':['3D','Product'],
  'shadow-tagger':['Game','Art','Motion'],'nft-generative-system':['AI','Art'],'atomic-cherry':['Game','Art'],
  'nfc-card':['Motion','Branding'],'graffiti':['Art','Mural']
};
const FFILTERS = [['all',T('Wszystko','All')],['branding','Branding'],['ui/ux','UI/UX'],['3d','3D'],['game',T('Gry','Games')],['art',T('Sztuka','Art')],['motion','Motion']];
const otherP = P.filter(x=>!x.hidden && x.slug!==slug);
let pfFilter = 'all';

function buildPfFilters(){
  document.getElementById('pfFilters').innerHTML = FFILTERS.map(([k,l])=>
    `<button class="pf-fbtn ${pfFilter===k?'active':''}" data-f="${k}">${FICONS[k]||''} ${l}</button>`
  ).join('');
  document.querySelectorAll('.pf-fbtn').forEach(b=>{
    b.onclick=()=>{ pfFilter=b.dataset.f; buildPfFilters(); buildPfGrid(); };
  });
}
function buildPfGrid(){
  const list = pfFilter==='all' ? otherP : otherP.filter(x=>x.category.toLowerCase().includes(pfFilter));
  document.getElementById('pfGrid').innerHTML = list.map(x=>{
    const tags = FTAGS[x.slug] || x.category.split(',').map(s=>s.trim());
    const href = x.slug==='hubble-rx' ? 'hubble.html' : 'projekt.html?p='+x.slug;
    return `<a href="${href}" class="pf-card">
      <span class="pf-ico">${FICONS[tags[0]?.toLowerCase()]||FICONS['all']}</span>
      <span class="pf-info">
        <span class="pf-name">${esc(x.title.split(' - ')[0].split(' – ')[0])}</span>
        <span class="pf-tags">${tags.join(' · ')}</span>
      </span>
    </a>`;
  }).join('') || `<div style="color:rgba(246,241,232,.4);font:500 13px 'IBM Plex Mono',monospace;padding:20px 0">${T('Brak projektów w tej kategorii','No projects in this category')}</div>`;
}
buildPfFilters();
buildPfGrid();

/* ---------- reveal ---------- */
const io=new IntersectionObserver(entries=>{
  entries.filter(e=>e.isIntersecting).forEach((e,j)=>{
    io.unobserve(e.target); e.target.style.opacity='';
    e.target.animate(
      [{opacity:0,transform:'translateY(34px)'},{opacity:1,transform:'none'}],
      {duration:800,delay:j*90,easing:'cubic-bezier(.2,.7,.2,1)',fill:'backwards'}
    );
  });
},{threshold:.08,rootMargin:'0px 0px -40px 0px'});
document.querySelectorAll('[data-reveal]').forEach(el=>{
  if(el.getBoundingClientRect().top > innerHeight*.9){ el.style.opacity='0'; io.observe(el); }
});
</script>

<script>
/* Vercel Web Analytics — z wykluczeniem wlasnych wizyt.
   Wejdz raz na ?noanalytics=1  -> ta przegladarka przestaje byc liczona (na stale).
   Wejdz na ?analytics=1        -> zliczanie wraca. */
(function(){
  try{
    var q = new URLSearchParams(location.search);
    if(q.has('noanalytics')) localStorage.setItem('aa_noanalytics','1');
    if(q.has('analytics'))   localStorage.removeItem('aa_noanalytics');
    if(localStorage.getItem('aa_noanalytics')) return;
  }catch(e){}
  var s = document.createElement('script');
  s.defer = true;
  s.src = '/_vercel/insights/script.js';
  document.head.appendChild(s);
})();
</script>
